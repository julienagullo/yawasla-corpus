<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Fond du favicon -->
  <rect width="512" height="512" rx="128" fill="#fff"/>

  <!-- Lettre Aleph avec Hamza (إ) stylisée -->
  <text
    x="50%"
    y="55%"
    font-family="'Amiri', 'Traditional Arabic', 'Noto Naskh Arabic', serif"
    font-size="700"
    font-weight="800"
    fill="#198754"
    stroke="#198754"
    stroke-width="14"
    paint-order="stroke fill"
    text-anchor="middle"
    dominant-baseline="middle">
    ء
  </text>
</svg>
